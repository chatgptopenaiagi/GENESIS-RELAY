name: Verify public downloads
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published prerelease tag
        default: v0.1.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  downloaded-artifacts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Download anonymously, verify and execute public artifacts
        run: python tools/verify_published.py --tag '${{ inputs.tag }}' --work out/public-downloads --report out/reports/public-${{ matrix.os }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-downloads-${{ matrix.os }}
          path: out/reports/*.json
          retention-days: 7
